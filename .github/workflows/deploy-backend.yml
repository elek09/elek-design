name: Deploy Backend to Dotroll

on:
  push:
    branches: [main]
    paths:
      - "backend/**"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy backend files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "backend"
          target: "~/domains/elekdesign.hu/backend/"
          strip_components: 1

      - name: Run Remote Deployment Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/domains/elekdesign.hu/backend
            composer install --no-dev --optimize-autoloader --no-interaction
            php artisan storage:link
            chmod 755 storage storage/app storage/app/public
            find storage/app/public -type d -exec chmod 755 {} \;
            find storage/app/public -type f -exec chmod 644 {} \;
            test -L public/storage
            php artisan migrate --force
            php artisan config:clear
            php artisan cache:clear
