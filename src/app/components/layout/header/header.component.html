<div class="header-bg">
  <div class="topnav" [class.responsive]="isMenuOpen" id="myTopnav" aria-label="Main navigation">
    <ng-container *ngIf="headerConfig$ | async as header">
      <!-- Logo / Home link -->
      <a [routerLink]="header.logoRouterLink || '/'" class="active" aria-label="Home">
        <img [src]="header.logoUrl" alt="Elek Design Logo" />
      </a>

      <!-- Navigation items -->
      <ng-container *ngFor="let item of header.items">
        <a *ngIf="!item.externalUrl"
           [routerLink]="item.routerLink || '/'"
           [fragment]="item.fragment || undefined"
           class="options"
           [ngClass]="item.class || null">
          {{ item.label }}
        </a>
        <a *ngIf="item.externalUrl"
           [href]="item.externalUrl"
           target="_blank" rel="noopener"
           class="options"
           [ngClass]="item.class || null">
          {{ item.label }}
        </a>
      </ng-container>
    </ng-container>

    <!-- Mobile menu toggle -->
    <a href="javascript:void(0);" class="icon" (click)="toggleMenu()" aria-label="Toggle menu">
      <img class="hambi" src="assets/images/hamburger.png" alt="Menu" />
    </a>
  </div>
</div>
