<div class="header-bg">
  <div class="topnav" [class.responsive]="isMenuOpen" id="myTopnav" aria-label="Main navigation">
    @if (headerConfig$ | async; as header) {
    <!-- Logo / Home link -->
    <a class="logo-link" routerLink="/" routerLinkActive="active" #rlaLogo="routerLinkActive" aria-label="Home"
      [attr.aria-current]="rlaLogo.isActive ? 'page' : null">
      <img class="logo-img" [src]="header.logoUrl" alt="Elek Design Logo" loading="lazy" decoding="async" />
    </a>

    <!-- Navigation items -->
    @for (item of header.items; track trackByNavItem($index, item)) {
    <a [routerLink]="item.routerLink" [routerLinkActiveOptions]="{ exact: true }"
      [fragment]="item.fragment || undefined" class="options" routerLinkActive="active" #rla="routerLinkActive"
      [ngClass]="item.class || null" [attr.aria-current]="rla.isActive ? 'page' : null">
      {{ item.label }}
    </a>
    }
    }

    <!-- Mobile menu toggle -->
    <button type="button" class="icon" (click)="toggleMenu()" aria-label="Toggle menu" [attr.aria-expanded]="isMenuOpen"
      aria-controls="myTopnav">
      <mat-icon>menu</mat-icon>
    </button>
  </div>
</div>
