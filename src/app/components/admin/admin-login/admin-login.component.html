<div class="admin-login-container">
    <div class="login-card">
        <div class="login-header">
            <h2>Admin Login</h2>
            <p>Sign in to manage your gallery</p>
        </div>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" formControlName="email" class="form-control"
                    [class.is-invalid]="getFieldError('email')" placeholder="Enter your email">
                <div class="invalid-feedback" *ngIf="getFieldError('email')">
                    {{ getFieldError('email') }}
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" formControlName="password" class="form-control"
                    [class.is-invalid]="getFieldError('password')" placeholder="Enter your password">
                <div class="invalid-feedback" *ngIf="getFieldError('password')">
                    {{ getFieldError('password') }}
                </div>
            </div>

            <div class="form-group" *ngIf="errorMessage">
                <div class="alert alert-danger">
                    {{ errorMessage }}
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-block" [disabled]="isLoading">
                <span *ngIf="isLoading" class="spinner"></span>
                {{ isLoading ? 'Signing In...' : 'Sign In' }}
            </button>
        </form>
    </div>
</div>
