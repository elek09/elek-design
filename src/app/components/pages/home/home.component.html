@if (loading) {
<app-loading-overlay [logoUrl]="'assets/images/elek-design-logo.png'"></app-loading-overlay>
}

<div class="main" [style.visibility]="loading ? 'hidden' : 'visible'">
  <app-carousel [slides]="(topCarouselSlides$ | async) ?? []" [autoPlay]="true" [showManualControls]="false"
    [hasTextOverlay]="true"></app-carousel>
  <hr>

  <app-category-section [sectionType]="'eletter'" [categories$]="eletterCategories$"
    [slides$]="eletterSlides$"></app-category-section>

  <hr>

  <app-category-section [sectionType]="'uzletter'" [categories$]="uzletterCategories$"
    [slides$]="uzletterSlides$"></app-category-section>

</div>
