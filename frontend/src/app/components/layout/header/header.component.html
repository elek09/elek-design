<div class="header-bg">
  <div class="topnav" [class.responsive]="isMenuOpen()" id="myTopnav" aria-label="Main navigation">
    <a class="logo-link" routerLink="/" [class.active]="isItemActive({id: 'logo'})" aria-label="Home"
      (click)="onNavItemClick({id: 'logo'})">
      <img class="logo-img" [src]="headerConfig().logoUrl" alt="Elek Design Logo" loading="lazy" decoding="async" />
    </a>

    @for (item of headerConfig().items; track trackByNavItem($index, item)) {
    <a [routerLink]="item.routerLink" [fragment]="item.fragment" class="options" [class.active]="isItemActive(item)"
      [ngClass]="item.class" (click)="onNavItemClick(item)">
      {{ item.label }}
    </a>
    }

    <a class="options cta" routerLink="/webshop" [class.active]="isItemActive({id: 'webshop'})"
      aria-label="Árajánlatot Kérek" (click)="onNavItemClick({id: 'webshop'})">
      <span class="cta-lines">Árajánlatot<br>Kérek!</span>
    </a>

    <button type="button" class="icon" (click)="toggleMenu()" aria-label="Toggle menu"
      [attr.aria-expanded]="isMenuOpen()" aria-controls="myTopnav">
      <mat-icon>menu</mat-icon>
    </button>
  </div>
</div>
