<div
  class="carousel-wrapper"
  [class.carousel--desktop]="displayMode() === 'desktop'"
  [class.carousel--mobile]="displayMode() === 'mobile'"
>
  <div
    class="carousel"
    (mouseenter)="onMouseEnter()"
    (mouseleave)="onMouseLeave()"
  >
    <div class="carousel__track-container">
      <ul class="carousel__track" [style.transform]="transformValue()">
        @for (slide of slides(); track slide; let i = $index) {
          <li
            class="carousel__slide"
            [class.current-slide]="i === currentSlideIndex()"
          >
            <img
              class="carousel__images"
              [src]="slide.imageUrl"
              [srcset]="
                slide.thumbUrl
                  ? slide.thumbUrl + ' 600w, ' + slide.imageUrl + ' 1024w'
                  : slide.imageUrl
              "
              sizes="(max-width: 600px) 100vw, 100vw"
              [alt]="slide.title || 'slide ' + i"
              decoding="async"
              [attr.fetchpriority]="prioritizeFirstImage() && i === 0 ? 'high' : null"
            />
            @if (hasTextOverlay() && slide.title) {
              <div class="text">
                {{ slide.title }}
              </div>
            }
          </li>
        }
      </ul>
    </div>

    @if (showManualControls()) {
      <button
        class="carousel_button carousel__button--left"
        (click)="previousSlide()"
        aria-label="Previous slide"
      >
        <mat-icon>keyboard_double_arrow_left</mat-icon>
      </button>
      <button
        class="carousel_button carousel__button--right"
        (click)="nextSlide()"
        aria-label="Next slide"
      >
        <mat-icon>keyboard_double_arrow_right</mat-icon>
      </button>
    }
  </div>
</div>
