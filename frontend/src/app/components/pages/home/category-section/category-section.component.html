@for (category of (categories$ | async) ?? []; track category?.id ?? category?.name ?? $index) {
<div class="part">
    <h1 class="sub-head" [id]="category.name">{{ category.name }}</h1>
</div>
<hr />
<div class="category-layout">
    <aside class="menu-list" [ngClass]="{ second: sectionType === 'uzletter' }">
        <ul>
            @for (subCategory of normalizeSubcategories(category.subcategories); track subCategory.id) {
            <li>
                <a href="#" (click)="$event.preventDefault(); onMenuClick(subCategory.slug)"
                    [class.active]="selectedSubId === subCategory.slug">
                    {{ subCategory.name }} »
                </a>
            </li>
            }
        </ul>
    </aside>
    <div class="content can-be-paged">
        <app-carousel #carousel [slides]="(slides$ | async) ?? []" [showManualControls]="true" [hasTextOverlay]="false"
            (slideChanged)="onSlideChanged($event)"></app-carousel>
    </div>
</div>
}
