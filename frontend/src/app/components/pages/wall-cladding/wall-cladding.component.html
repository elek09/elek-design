<div class="main">
<app-carousel
  [slides]="(topCarouselSlides$ | async) ?? []"
  [autoPlay]="true"
  [showManualControls]="false"
  [hasTextOverlay]="true"
></app-carousel>

<section class="extra-page__intro">
  <p class="extra-page__eyebrow">Egyedi felületek</p>
  <h1 id="3D-falborítás">3D falborítás</h1>
  <p>
    Látványos, karakteres falburkolatok otthonokba és üzlethelyiségekbe,
    méretre és az enteriőr hangulatához igazítva.
  </p>
</section>

<div class="extra-page__gallery">
  <app-gallery-mosaic
    [slides]="(wallCladdingSlides$ | async) ?? []"
    groupName="3D falborítás"
    groupSlug="3d-falboritas"
  ></app-gallery-mosaic>
</div>
</div>
